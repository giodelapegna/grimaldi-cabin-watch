name: Grimaldi cabin watch

on:
  schedule:
    # Every 30 minutes. GitHub may delay scheduled runs under load,
    # so treat this as "roughly every 30-45 min", not a guarantee.
    - cron: '*/30 * * * *'
  workflow_dispatch: {}   # lets you trigger a check by hand

concurrency:
  group: cabin-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      ROUTE: ITCAG-ITNAP        # Cagliari -> Napoli
      DATE: '06092026'          # ddmmyyyy
      DAY_LABEL: '6 SET'        # label on the result card
      ADULTS: '2'
      # Keep this 'false'. GitHub emails you when a run fails, so there is no
      # need to also buzz your phone every 30 minutes while something is broken.
      ALERT_ON_FAILURE: 'false'
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Check cabin availability
        run: node check.js

      - name: Upload debug snapshots
        if: always()          # uploaded on success too, so we can verify the flow
        uses: actions/upload-artifact@v4
        with:
          name: debug-snapshots
          path: debug/
          if-no-files-found: ignore
          retention-days: 7
